apiVersion: v2
name: wordpress-nginx
version: 7.1.411
appVersion: "7.1.4"

description: >-
  WordPress with NGINX for Kubernetes. Supports internal or external MariaDB,
  Dragonfly (Redis/Memcached) caching, and an optional FlexSearch sidecar
  (wordpress-idx) for full-text search.
home: https://wordpress-nginx.ioanalytica.com
icon: https://raw.githubusercontent.com/ioanalytica/wordpress-nginx/main/icon.png
sources:
- https://github.com/ioanalytica/wordpress-nginx

maintainers:
- name: IO ANALYTICA
  url: https://ioanalytica.com

keywords:
- application
- blog
- cms
- http
- php
- web
- wordpress
- nginx

# What Artifact Hub shows for the chart
# (https://artifacthub.io/docs/topics/annotations/helm/). A release adds
# artifacthub.io/changes and artifacthub.io/prerelease when it packages the
# chart (scripts/artifacthub-annotations.sh); they are not written here.
#
# The images are every image the chart can run, at the tags it runs them
# with: the two images of this project at the chart version, which is their
# tag, every other one at the tag chart/values.yaml or a template gives it
# (chart/tests/template-test.sh). Artifact Hub scans them for vulnerabilities.
#
# No category: Artifact Hub's list has none for a content management system,
# and skip-prediction keeps it from guessing one.
annotations:
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: Apache-2.0
  # NOTE: The WordPress application deployed by this chart is GPL-2.0+.
  artifacthub.io/links: |
    - name: Changelog
      url: https://wordpress-nginx.ioanalytica.com/reference/changelog
    - name: Verify a release
      url: https://wordpress-nginx.ioanalytica.com/security/verify
    - name: support
      url: https://github.com/ioanalytica/wordpress-nginx/issues
  artifacthub.io/images: |
    - name: wordpress-nginx
      image: ghcr.io/ioanalytica/wordpress-nginx:7.1.411
    - name: wordpress-idx
      image: ghcr.io/ioanalytica/wordpress-idx:7.1.411
    - name: nginx-prometheus-exporter
      image: docker.io/nginx/nginx-prometheus-exporter:1.5.3
    - name: mariadb
      image: docker.io/mariadb:12.3.3-noble
    - name: dragonfly
      image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    - name: busybox
      image: docker.io/busybox:latest

dependencies:
- name: common
  repository: oci://ghcr.io/ioanalytica/charts
  version: 0.1.x
