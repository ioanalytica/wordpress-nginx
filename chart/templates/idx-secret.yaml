{{- /*
The reindex key of the search sidecar. With idx.enabled there is always one:
idx.reindexApiKey when it is set, else the key this Secret already holds,
else a new one. The lookup keeps a generated key across upgrades; the Secret
does not exist yet when an installation without a key is upgraded, which is
why a missing one is no error here.
*/}}
{{- if and .Values.idx.enabled (not .Values.idx.existingReindexApiKeySecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-idx" (include "common.names.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
type: Opaque
data:
  idx-reindex-api-key: {{ include "common.secrets.passwords.manage" (dict "secret" (include "wordpress.idx.reindexApiKeySecretName" .) "key" "idx-reindex-api-key" "providedValues" (list "idx.reindexApiKey") "length" 32 "honorProvidedValues" true "failOnNew" false "context" $) }}
{{- end }}
