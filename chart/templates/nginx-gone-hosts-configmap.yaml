{{- if (include "wordpress.redirect.hasGoneHosts" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wordpress.nginx.goneHostsConfigmapName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  10-chart.conf: |-
    # Retired hostnames declared in redirect.goneHosts. Map entries for
    # $wp_gone_target: a hostname, then the URL a browser is sent to.
    # Crawlers get 410 on every path of these hosts instead.
    {{- range .Values.redirect.goneHosts }}
    "{{ . }}" "{{ include "wordpress.redirect.goneTarget" $ }}";
    {{- end }}
{{- end }}
