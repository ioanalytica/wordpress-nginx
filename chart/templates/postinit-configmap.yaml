{{- /*
Copyright IO ANALYTICA. All Rights Reserved.
SPDX-License-Identifier: Apache-2.0

Scripts for the image's "application" hook. The deployment mounts every
data key as a single file at /etc/hooks/application/zz-<key> (subPath,
mode 0750): the hook runner executes plain executable files in that
directory via run-parts, which neither descends into subdirectories nor
runs non-executable files - mounting the ConfigMap as a directory, or
without the exec bit, silently runs nothing.

The hook runs on EVERY container start, so every script here must be
idempotent, and must not fail the boot: a missing network egress or an
absent plugin is logged and skipped, never fatal.

Key names are ordering (run-parts sorts lexically, after the image's
init-wordpress since everything is mounted with a zz- prefix):
  00-preinstall-plugins.sh        first, so a preinstalled cache plugin
  05-idx-plugin.sh                (idx.enabled) brings the search plugin
                                  to the sidecar's build
  10-configure-w3-total-cache.sh  is already active when this runs
  <customPostInitScripts keys>    letters sort after the digit prefixes
*/}}

{{- range $name, $_ := .Values.customPostInitScripts }}
{{- if not (hasSuffix ".sh" $name) }}
{{- fail (printf "customPostInitScripts: %q - the application hook executes .sh scripts only" $name) }}
{{- end }}
{{- end }}
{{- if (include "wordpress.createPostinitConfigmap" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-postinit" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  {{- if .Values.wordpressPreinstallPlugins }}
  00-preinstall-plugins.sh: |-
    #!/bin/bash

    # Plugins declared in wordpressPreinstallPlugins. Idempotent: installs
    # only what is missing, activates only what is inactive. The install
    # needs egress to wordpress.org; without it the step is logged and
    # skipped - an unreachable mirror must not keep the pod from starting.
    {{- range .Values.wordpressPreinstallPlugins }}

    if ! wp plugin is-installed {{ .name | quote }} 2>/dev/null; then
      wp plugin install {{ .name | quote }} \
        || echo "[preinstall-plugins] could not install {{ .name }} (no egress to wordpress.org?) - continuing"
    fi
    {{- if or (not (hasKey . "activate")) .activate }}
    if wp plugin is-installed {{ .name | quote }} 2>/dev/null \
        && ! wp plugin is-active {{ .name | quote }} 2>/dev/null; then
      wp plugin activate {{ .name | quote }} \
        || echo "[preinstall-plugins] could not activate {{ .name }} - continuing"
    fi
    {{- end }}
    {{- if or (not (hasKey . "autoUpdate")) .autoUpdate }}
    if wp plugin is-installed {{ .name | quote }} 2>/dev/null; then
      # Errors when auto-updates are already on; that is the desired state.
      wp plugin auto-updates enable {{ .name | quote }} >/dev/null 2>&1 || true
    fi
    {{- end }}
    {{- end }}
  {{- end }}
  {{- if .Values.idx.enabled }}
  05-idx-plugin.sh: |-
    #!/bin/bash

    # The wordpress-idx search plugin, from the sidecar that shares this pod:
    # installed and activated when missing, updated when the sidecar ships a
    # newer build and idx.pluginAutoUpdate is on (off: updates are only
    # offered in wp-admin). The source is the sidecar's own package over
    # loopback, never wordpress.org, so plugin and sidecar stay one release.
    # Waiting for the sidecar is bounded and every failure is logged and
    # skipped - the plugin must not keep the site from starting.
    base="http://127.0.0.1:{{ .Values.idx.port }}{{ .Values.idx.basePath }}/plugin"
    slug="wordpress-idx-search"

    if ! wp core is-installed 2>/dev/null; then
      echo "[idx-plugin] WordPress is not installed yet - skipping"
      exit 0
    fi

    # The sidecar starts alongside this container and may still be pulling
    # its image; it serves the package as soon as it listens.
    manifest=""
    for _ in $(seq 1 60); do
      manifest="$(curl -fsS --max-time 2 "$base/update-info.json" 2>/dev/null)" && break
      manifest=""
      sleep 1
    done
    if [ -z "$manifest" ]; then
      echo "[idx-plugin] sidecar not reachable at $base - continuing"
      exit 0
    fi

    offered="$(printf '%s' "$manifest" | php -r '$m = json_decode(stream_get_contents(STDIN), true); echo is_array($m) && isset($m["version"]) ? $m["version"] : "";')"
    if [ -z "$offered" ]; then
      echo "[idx-plugin] sidecar manifest has no version - continuing"
      exit 0
    fi

    installed=""
    if wp plugin is-installed "$slug" 2>/dev/null; then
      installed="$(wp plugin get "$slug" --field=version 2>/dev/null)"
    fi

    if [ -n "$installed" ]; then
      {{- if .Values.idx.pluginAutoUpdate }}
      if ! php -r 'exit(version_compare($argv[1], $argv[2], "<") ? 0 : 1);' "$installed" "$offered"; then
        echo "[idx-plugin] $slug $installed is current (sidecar offers $offered)"
        exit 0
      fi
      {{- else }}
      echo "[idx-plugin] $slug $installed installed, sidecar offers $offered - updates are left to wp-admin"
      exit 0
      {{- end }}
    fi

    if ! tmpdir="$(mktemp -d)"; then
      echo "[idx-plugin] no temporary directory - continuing"
      exit 0
    fi
    trap 'rm -rf "$tmpdir"' EXIT
    # The hook runs as root, wp as the web user: mktemp's 0700 would hide the
    # package, and wp-cli then reports the path as an "invalid plugin slug".
    chmod 0755 "$tmpdir"
    package="$tmpdir/$slug.zip"
    if ! curl -fsS --max-time 60 -o "$package" "$base/$slug.zip"; then
      echo "[idx-plugin] could not download $slug $offered from the sidecar - continuing"
      exit 0
    fi

    if [ -z "$installed" ]; then
      wp plugin install "$package" --activate \
        && echo "[idx-plugin] installed and activated $slug $offered" \
        || echo "[idx-plugin] could not install $slug $offered - continuing"
    else
      # --force replaces the files in place; the activation state is kept.
      wp plugin install "$package" --force \
        && echo "[idx-plugin] updated $slug $installed -> $offered" \
        || echo "[idx-plugin] could not update $slug to $offered - continuing"
    fi
  {{- end }}
  {{- if .Values.wordpressConfigureCache }}
  {{- $cacheFullname := include "wordpress.cacheHost" . }}
  {{- $cachePort := include "wordpress.cachePort" . | int }}
  {{- $cacheType := include "wordpress.cacheType" . }}
  10-configure-w3-total-cache.sh: |-
    #!/bin/bash

    # Configure W3 Total Cache - only when it is the active caching plugin.
    # Deliberately no install or activate here: sites that run a different
    # caching plugin set wordpressConfigureCache too, and activating a
    # second page cache would fight over the drop-ins
    # (advanced-cache.php, object-cache.php). Declare w3-total-cache in
    # wordpressPreinstallPlugins to install and activate it declaratively.
    if ! wp plugin is-active w3-total-cache 2>/dev/null; then
      echo "[configure-cache] w3-total-cache is not active - leaving caching untouched"
      exit 0
    fi

    # W3TC cannot detect the web server under wp-cli - a CLI request has no
    # SERVER_SOFTWARE - and falls back to managing Apache .htaccess rules.
    # The WordPress root is immutable here, so that fails on every boot with
    # W3TC's misleading "FTP credentials" error. Declared as nginx (PHP CLI
    # surfaces the variable into $_SERVER), fix_environment maintains its
    # rules in the plugin-managed nginx.conf instead - writable, and already
    # classified as plugin-managed by the .htaccess report.
    export SERVER_SOFTWARE=nginx

    wp total-cache fix_environment

    wp total-cache option set dbcache.engine {{ $cacheType }} --type=string
    wp total-cache option set objectcache.engine {{ $cacheType }} --type=string
    wp total-cache flush all
    wp total-cache option set dbcache.{{ $cacheType }}.servers {{ $cacheFullname }}:{{ $cachePort }} --type=string
    wp total-cache option set dbcache.enabled true --type=boolean
    wp total-cache option set objectcache.{{ $cacheType }}.servers {{ $cacheFullname }}:{{ $cachePort }} --type=string
    wp total-cache option set objectcache.enabled true --type=boolean

    # Page cache. Needs WP_CACHE in wp-config.php to have any effect, which the
    # chart defines (wordpressWpCache); enabling pgcache here without it would
    # leave advanced-cache.php on disk and never loaded.
    wp total-cache option set pgcache.engine {{ $cacheType }} --type=string
    wp total-cache option set pgcache.{{ $cacheType }}.servers {{ $cacheFullname }}:{{ $cachePort }} --type=string
    wp total-cache option set pgcache.enabled true --type=boolean

    # Authentication. The value comes from the environment, not from this
    # ConfigMap. The internal Dragonfly always runs with --requirepass, so
    # skipping this would leave every cache unable to connect.
    if [ -n "${WORDPRESS_CACHE_PASSWORD:-}" ]; then
      wp total-cache option set dbcache.{{ $cacheType }}.password "$WORDPRESS_CACHE_PASSWORD" --type=string
      wp total-cache option set objectcache.{{ $cacheType }}.password "$WORDPRESS_CACHE_PASSWORD" --type=string
      wp total-cache option set pgcache.{{ $cacheType }}.password "$WORDPRESS_CACHE_PASSWORD" --type=string
    fi

    wp total-cache flush all

  {{- end }}
  {{- if .Values.customPostInitScripts }}
  {{- include "common.tplvalues.render" (dict "value" .Values.customPostInitScripts "context" $) | nindent 2 }}
  {{- end }}
{{- end }}
