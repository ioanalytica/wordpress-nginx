apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list .Values.podLabels .Values.commonLabels ) "context" . ) }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
  {{- if .Values.updateStrategy }}
  strategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" $podLabels "context" $ ) | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.metrics.enabled (include "wordpress.createConfigSecret" .) (include "wordpress.nginx.createServerblockConfigmap" .) (include "wordpress.nginx.createConfigmap" .) (include "wordpress.nginx.createPhpAllowlistConfigmap" .) (include "wordpress.nginx.createRestHardeningConfigmap" .) .Values.nginx.deniedPaths (include "wordpress.redirect.hasGoneHosts" .) (include "wordpress.createPostinitConfigmap" .) }}
      annotations:
        {{- if .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
        {{- if .Values.metrics.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.metrics.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
        {{- if (include "wordpress.createConfigSecret" .) }}
        checksum/config-secret: {{ include (print $.Template.BasePath "/config-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- /*
        NGINX configuration is mounted from ConfigMaps with subPath, and a
        subPath mount never receives ConfigMap updates - the kubelet projects
        the file once at container start. Without these checksums a values
        change renders new ConfigMap content while the Deployment spec stays
        byte-identical, so no rollout happens and running pods keep serving the
        old configuration indefinitely, with nothing to indicate it.
        */}}
        {{- if (include "wordpress.nginx.createServerblockConfigmap" .) }}
        checksum/nginx-serverblock: {{ include (print $.Template.BasePath "/nginx-serverblock-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if (include "wordpress.nginx.createConfigmap" .) }}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/nginx-config-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if (include "wordpress.nginx.createPhpAllowlistConfigmap" .) }}
        checksum/nginx-php-allowlist: {{ include (print $.Template.BasePath "/nginx-php-allowlist-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if (include "wordpress.nginx.createRestHardeningConfigmap" .) }}
        checksum/nginx-rest-hardening: {{ include (print $.Template.BasePath "/nginx-rest-hardening-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.nginx.deniedPaths }}
        checksum/nginx-denied-paths: {{ include (print $.Template.BasePath "/nginx-denied-paths-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if (include "wordpress.redirect.hasGoneHosts" .) }}
        checksum/nginx-gone-hosts: {{ include (print $.Template.BasePath "/nginx-gone-hosts-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if (include "wordpress.createPostinitConfigmap" .) }}
        checksum/postinit: {{ include (print $.Template.BasePath "/postinit-configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- include "wordpress.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- if .Values.hostAliases }}
      # yamllint disable rule:indentation
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      # yamllint enable rule:indentation
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAffinityPreset "customLabels" $podLabels "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "customLabels" $podLabels "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName | quote }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wordpress.serviceAccountName" .}}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.topologySpreadConstraints "context" .) | nindent 8 }}
      {{- end }}
      initContainers:
        - name: prepare-base-dir
          image: busybox
          imagePullPolicy: IfNotPresent
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- else if ne .Values.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 12 }}
          {{- end }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          command:
            - /bin/ash
          args:
            - -ec
            - |
              ENVVARS="WORDPRESS_DB_NAME WORDPRESS_DB_USER WORDPRESS_DB_PASSWORD WORDPRESS_DB_HOST WORDPRESS_DB_CHARSET WORDPRESS_DB_COLLATE WORDPRESS_TABLE_PREFIX WORDPRESS_SCHEME WORDPRESS_DEBUG WORDPRESS_CONFIG_EXTRA WORDPRESS_EMAIL WORDPRESS_PLUGINS WORDPRESS_EXTRA_WP_CONFIG_CONTENT"

              echo "Checking environment for required settings …"

              for var in $ENVVARS; do
                # Use eval to get the value of the variable
                eval "value=\$$var"

                if [ -z "$value" ]; then
                  echo "Checking $var: x - Please check!"
                else
                  echo "Checking $var: ✓"
                fi
              done

              echo "Checking mounted volume …"

              if [ ! -d /wordpress/wp-content ]; then
                echo "Creating wp-content directory on mounted volume …"
                mkdir -p /wordpress/wp-content
                chown www-data:www-data /wordpress/wp-content
              fi

              if [ ! -f /wordpress/ngingx.conf ]; then
                echo "Creating site nginx.conf on mounted volume …"
                touch /wordpress/nginx.conf
                chown www-data:www-data /wordpress/nginx.conf
              fi

              if [ ! -f /wordpress/salts.php ]; then
                echo "Creating site salts.php on mounted volume …"
                echo "<?php" > /wordpress/salts.php
                wget -q -O - https://api.wordpress.org/secret-key/1.1/salt/ >> /wordpress/salts.php
                chown www-data:www-data /wordpress/salts.php
              fi

              mkdir -p /tmp/wp-tmp
              chmod 777 /tmp/wp-tmp

              echo "Creating site wp-config.php on mounted volume …"
              cat <<'EOF' > /wordpress/wp-config.php
              <?php
              // a helper function to lookup "env_FILE", "env", then fallback
              if (!function_exists('getenv_docker')) {
                  // https://github.com/docker-library/wordpress/issues/588 (WP-CLI will load this file 2x)
                  function getenv_docker($env, $default) {
                      if ($fileEnv = getenv($env . '_FILE')) {
                          return rtrim(file_get_contents($fileEnv), "\r\n");
                      }
                      else if (($val = getenv($env)) !== false) {
                          return $val;
                      }
                      else {
                          return $default;
                      }
                  }
              }

              define( 'DB_NAME', getenv_docker('WORDPRESS_DB_NAME', 'wordpress') );
              define( 'DB_USER', getenv_docker('WORDPRESS_DB_USER', 'example username') );
              define( 'DB_PASSWORD', getenv_docker('WORDPRESS_DB_PASSWORD', 'example password') );
              define( 'DB_HOST', getenv_docker('WORDPRESS_DB_HOST', 'mysql') );
              define( 'DB_CHARSET', getenv_docker('WORDPRESS_DB_CHARSET', 'utf8mb4') );
              define( 'DB_COLLATE', getenv_docker('WORDPRESS_DB_COLLATE', '') );
              EOF

              cat <<'EOF' >> /wordpress/wp-config.php

              $table_prefix = getenv_docker('WORDPRESS_TABLE_PREFIX', 'wp_');

              define('WP_TEMP_DIR', '/tmp/wp-tmp');
              define( 'WP_DEBUG', false );
              define( 'FS_METHOD', 'direct' );

              // Page cache drop-in loading. Set from the chart rather than left
              // to the cache plugin, because this file is regenerated on every
              // container start and a plugin-written constant would not survive.
              define( 'WP_CACHE', {{ include "wordpress.wpCache" . }} );

              if (isset($_SERVER['HTTP_HOST'])) {
                  define( 'WP_HOME', getenv_docker('WORDPRESS_SCHEME', 'http') . '://' . $_SERVER['HTTP_HOST'] . '/' );
                  define( 'WP_SITEURL', getenv_docker('WORDPRESS_SCHEME', 'http') . '://' . $_SERVER['HTTP_HOST'] . '/' );
              } elseif ($host = getenv_docker('WORDPRESS_HOSTNAME', '')) {
                  // wp-cli/cron: no request context. The canonical hostname
                  // reaches the site through the ingress, so the public
                  // scheme stays valid from inside the pod.
                  define( 'WP_HOME', getenv_docker('WORDPRESS_SCHEME', 'http') . '://' . $host . '/' );
                  define( 'WP_SITEURL', getenv_docker('WORDPRESS_SCHEME', 'http') . '://' . $host . '/' );
              } else {
                  // No request, no hostname. TLS terminates at the ingress,
                  // so a loopback URL must stay plain http on the container
                  // port.
                  define( 'WP_HOME', 'http://localhost:' . getenv_docker('NGINX_HTTP_PORT_NUMBER', '80') . '/' );
                  define( 'WP_SITEURL', 'http://localhost:' . getenv_docker('NGINX_HTTP_PORT_NUMBER', '80') . '/' );
              }
              define( 'WP_AUTO_UPDATE_CORE', false );

              if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
                  $_SERVER['HTTPS'] = 'on';
              }

              if ($configExtra = getenv_docker('WORDPRESS_CONFIG_EXTRA', '')) {
                  eval($configExtra);
              }
              {{- if .Values.idx.enabled }}

              // Reach the idx sidecar over loopback: it shares this pod's
              // network namespace, so this is the shortest path and needs
              // neither DNS nor egress. The plugin's server-side calls (update
              // check, reindex) otherwise resolve through site_url() to the
              // site's public URL, which the pod can only use if it may reach
              // the site from the inside — restrictive network policies may
              // prevent that. It then fails silently: the plugin stops
              // offering updates while the search keeps working, because that
              // runs in the visitor's browser and never takes this path.
              // Defined after WORDPRESS_CONFIG_EXTRA so an operator can
              // override it there for split-pod or external setups.
              if ( ! defined( 'WORDPRESS_IDX_BASE' ) ) {
                  define( 'WORDPRESS_IDX_BASE', 'http://127.0.0.1:{{ .Values.idx.port }}{{ .Values.idx.basePath }}' );
              }
              {{- end }}

              if ( ! defined( 'ABSPATH' ) ) {
                  define( 'ABSPATH', __DIR__ . '/' );
              }

              require_once ABSPATH . 'salts.php';
              require_once ABSPATH . 'wp-settings.php';

              /**
               * Disable pingback.ping xmlrpc method to prevent WordPress from participating in DDoS attacks
               */
              if ( !defined( 'WP_CLI' ) ) {
                // remove x-pingback HTTP header
                add_filter("wp_headers", function($headers) {
                        unset($headers["X-Pingback"]);
                        return $headers;
                });
                // disable pingbacks
                add_filter( "xmlrpc_methods", function( $methods ) {
                        unset( $methods["pingback.ping"] );
                        return $methods;
                });
              }
              EOF
              chown www-data:www-data /wordpress/wp-config.php
              {{- if .Values.idx.enabled }}

              echo "Preparing idx directory on mounted volume …"
              mkdir -p /idx
              chown 1000:1000 /idx
              {{- end }}

              echo "Checking wp-content for .htaccess files …"
              # NGINX never reads .htaccess. A plugin that writes one with "deny
              # from all" assumes Apache and believes the directory is protected;
              # here it stays open and nothing says so. This check says so.
              #
              # It classifies each file by content, because the obvious reading -
              # "an .htaccess means deny the directory" - is wrong often enough to
              # do damage: W3 Total Cache's pub/.htaccess guards PHP execution and
              # wants its static assets served, Contact Form 7's captcha directory
              # denies everything except the captcha images, and an .htaccess that
              # says "allow from all" for .php in an upload directory is not a
              # protection at all but the classic companion of a webshell.
              #
              #   deny     - deny with no allow exception, narrowed by what it denies:
              #     whole directory - propose a directory deny
              #     extensions      - <Files *.php>, <FilesMatch "\.(php|phtml)$">: judged per
              #                       extension. php is covered by the PHP allowlist in
              #                       enforce mode - unless extraAllowedPaths lets a PHP file
              #                       there run; every other extension (phtml, phps, phar, log)
              #                       NGINX serves as a plain file, so it needs a deniedPaths
              #                       regex. Never the directory: for uploads/, that would
              #                       block every image
              #     named files     - <Files debug.log> (a <Files> name, not a regex): one
              #                       deny per file
              #     dotfiles        - <Files .ht*>, <FilesMatch "^\.">: NGINX denies dotfiles
              #                       for every location already, so covered
              #   partial  - deny plus <Files>/<FilesMatch> allow exceptions: report,
              #              no proposal; a directory deny would break the exception
              #   allow    - allow from all / Require all granted, or PHP allowed in
              #              uploads: flag as SUSPICIOUS, never propose anything
              #   other    - rewrites, headers, mime, options: report as informational
              # Any other pattern - a regex such as <FilesMatch "debug.log"> (unanchored,
              # "." is any character) or <Files ~ ".*\..*"> - counts as a whole-directory
              # deny: the report proposes nothing narrower than it can state exactly.
              #
              # Plugins that do think of NGINX write their rules into the per-site
              # /wordpress/nginx.conf (W3 Total Cache does). A directory that has a
              # location or rewrite there is reported as "plugin-managed", not as
              # uncovered - a deniedPaths entry would run first and override it.
              #
              # Coverage tests a request path against every nginx.deniedPaths entry
              # in the form NGINX gets it - a case-insensitive regex, plain paths
              # included - with busybox grep -iE. ERE is close to PCRE for the
              # patterns used here; an entry using PCRE-only syntax ((?!...), \d)
              # fails to compile in grep and covers nothing, so its directory is
              # reported as uncovered rather than silently assumed closed.
              # With policy=fail, only an uncovered deny blocks the start; partial,
              # allow and other never do, since there is nothing a deniedPaths entry
              # could correctly add for them.
              HTACCESS_POLICY="{{ .Values.nginx.htaccessPolicy }}"
              PHP_ALLOWLIST_MODE="{{ .Values.phpExecutionAllowlist.mode }}"
              # One regex per line, quoted heredoc: entries are matched, never
              # expanded by the shell.
              cat > /tmp/denied-paths.all <<'DENIED_PATHS_EOF'
              {{- range .Values.nginx.deniedPaths }}
              {{ include "wordpress.nginx.deniedPathRegex" . | trimPrefix "~*" }}
              {{- end }}
              DENIED_PATHS_EOF
              # PHP the allowlist lets through on top of the core entry points; a
              # PHP deny over such a file is not covered by the allowlist.
              cat > /tmp/php-extra-allowed.all <<'PHP_EXTRA_ALLOWED_EOF'
              {{- range .Values.phpExecutionAllowlist.extraAllowedPaths }}
              {{- $p := trim . }}
              {{- /* Without "~" an NGINX map key is an exact string, not a regex. */}}
              {{ if hasPrefix "~" $p }}{{ trimPrefix "~" $p | trimPrefix "*" | trim }}{{ else }}^{{ regexQuoteMeta $p }}${{ end }}
              {{- end }}
              PHP_EXTRA_ALLOWED_EOF
              # keep_compiling <in> <out>: the entries busybox grep can compile. One
              # bad entry in a grep -f list fails every match, so each is tried
              # alone first; grep exits 2 on a pattern it cannot compile.
              keep_compiling() {
                : > "$2"
                while IFS= read -r re; do
                  [ -n "$re" ] || continue
                  rc=0; printf 'x\n' | grep -qiE -- "$re" 2>/dev/null || rc=$?
                  if [ "$rc" -le 1 ]; then printf '%s\n' "$re" >> "$2"; fi
                done < "$1"
              }
              # pcre_alike <in> <out>: the entries busybox ERE and NGINX PCRE read
              # alike. One that compiles in ERE can still mean something else in
              # PCRE (\d, \w, (?...), {,n}, possessive a++).
              pcre_alike() {
                grep -vE -e '\\[A-Za-z0-9]' -e '\(\?' -e '\{,' -e '[*+?}]\+' "$1" > "$2" || true
              }
              # Only deniedPaths entries both read alike count as coverage; any
              # other entry covers nothing in this report - erring toward
              # "uncovered".
              keep_compiling /tmp/denied-paths.all /tmp/denied-paths.compiled
              pcre_alike /tmp/denied-paths.compiled /tmp/denied-paths
              # extraAllowedPaths errs the other way: an entry this report cannot
              # read as NGINX does may still let PHP run. Then no PHP deny is
              # credited to the allowlist. The lookup of PHP it opens keeps every
              # entry that compiles - matching too much there errs toward "open".
              keep_compiling /tmp/php-extra-allowed.all /tmp/php-extra-allowed
              pcre_alike /tmp/php-extra-allowed /tmp/php-extra-allowed.alike
              PHP_EXTRA_UNCHECKED=0
              [ "$(grep -c . /tmp/php-extra-allowed.all || true)" = "$(grep -c . /tmp/php-extra-allowed.alike || true)" ] \
                || PHP_EXTRA_UNCHECKED=1
              # matches_any <file> <path>: does any regex in <file> match <path>?
              matches_any() {
                [ -s "$1" ] && printf '%s\n' "$2" | grep -qiE -f "$1"
              }
              # re_quote <text>: <text> as a literal inside a regex.
              re_quote() {
                printf '%s' "$1" | sed 's/[].[^$()|*+?{}\\]/\\&/g'
              }
              # denies_all <dir> <name> [find tests...]: do deniedPaths close a new
              # file <name> in <dir> and in a subdirectory of it, and every file
              # under <dir> the find tests select now? An .htaccess governs its
              # subdirectories too, and a rule that matches only some names would
              # pass a synthetic probe alone.
              denies_all() {
                da_dir="$1"; da_rel="${1#/wordpress}"; da_name="$2"; shift 2
                matches_any /tmp/denied-paths "$da_rel/$da_name" || return 1
                matches_any /tmp/denied-paths "$da_rel/x/$da_name" || return 1
                find "$da_dir" -type f ! -name '.*' "$@" 2>/dev/null > /tmp/dir-files || true
                da_open="$(sed 's#^/wordpress##' /tmp/dir-files | grep -viE -f /tmp/denied-paths | head -n1 || true)"
                [ -z "$da_open" ]
              }
              # PHP files under wp-content that extraAllowedPaths lets execute -
              # listed once, so each .htaccess only looks its directory up.
              : > /tmp/php-open
              if [ "$PHP_ALLOWLIST_MODE" = enforce ] && [ -s /tmp/php-extra-allowed ] && [ -d /wordpress/wp-content ]; then
                find /wordpress/wp-content -type f -iname '*.php' 2>/dev/null | sed 's#^/wordpress##' \
                  | grep -iE -f /tmp/php-extra-allowed > /tmp/php-open || true
              fi
              rm -f /tmp/htaccess-found /tmp/htaccess-blocking
              if [ -d /wordpress/wp-content ]; then
                # -print, not -printf: busybox find has no -printf.
                find /wordpress/wp-content -type f -name .htaccess -print 2>/dev/null | while IFS= read -r f; do
                  touch /tmp/htaccess-found
                  dir="${f%/.htaccess}"
                  rel="${dir#/wordpress}"
                  # Directives only - comments and blank lines dropped, CRLF
                  # stripped. The file is plugin-written content: it is matched,
                  # never evaluated.
                  # "|| true": grep exits 1 when a file holds nothing but comments
                  # or is empty, and under "set -e" a failing command substitution
                  # in an assignment aborts the script - which would stop the init
                  # container and keep the pod from ever starting.
                  body="$(tr -d '\r' < "$f" 2>/dev/null | grep -vE '^[[:space:]]*(#|$)' || true)"
                  has_deny=0; has_allow=0; php_allow=0
                  printf '%s' "$body" | grep -qiE '(deny[[:space:]]+from[[:space:]]+all|require[[:space:]]+all[[:space:]]+denied)' && has_deny=1
                  printf '%s' "$body" | grep -qiE '(allow[[:space:]]+from[[:space:]]+all|require[[:space:]]+all[[:space:]]+granted)' && has_allow=1
                  # "allow from all" inside a <Files> block that names .php, in an
                  # upload tree, is the webshell-enabling pattern.
                  case "$rel" in /wp-content/uploads/*)
                    printf '%s' "$body" | grep -qiE '<Files[^>]*\.?\(?php' && [ "$has_allow" = 1 ] && php_allow=1 ;;
                  esac
                  # A <Files> block only makes a deny "partial" when it carries an
                  # allow; a <FilesMatch "^."> that denies dotfiles on top of a
                  # blanket deny is still a blanket deny.
                  if [ -z "$body" ]; then class=empty
                  elif [ "$php_allow" = 1 ]; then class=allow
                  elif [ "$has_allow" = 1 ] && [ "$has_deny" = 0 ]; then class=allow
                  elif [ "$has_deny" = 1 ] && [ "$has_allow" = 1 ]; then class=partial
                  elif [ "$has_deny" = 1 ]; then class=deny
                  else class=other
                  fi
                  # Per-site nginx.conf: a plugin may already have translated this
                  # directory into an NGINX rule. Match on the directory's last two
                  # path segments, which is how W3TC writes its locations - taken
                  # literally, and never for wp-content itself, whose name nearly
                  # every rule in that file carries.
                  plugin_managed=0
                  if [ -s /wordpress/nginx.conf ] && [ "$rel" != /wp-content ]; then
                    tail2="$(re_quote "$(printf '%s' "$rel" | awk -F/ '{print $(NF-1)"/"$NF}')")"
                    # ".*", not "[^\n]*": busybox grep has no \n escape inside a bracket
                    # expression - it would exclude the letter n and miss "minify".
                    grep -qE "(location|rewrite).*${tail2}" /wordpress/nginx.conf 2>/dev/null && plugin_managed=1
                  fi
                  # Probe files inside, not the directory itself: an entry that only
                  # matches "<dir>/" leaves every file below it open.
                  # Only the classes that report coverage pay for the subtree walk.
                  dir_cov=no
                  case "$class" in deny|partial|allow)
                    denies_all "$dir" x && dir_cov=yes ;;
                  esac
                  covered=$dir_cov
                  # What a deny covers: one line per deny directive - "ALL" outside any
                  # <Files>/<FilesMatch> block, else "F <pattern>" for <Files> and
                  # "M <pattern>" for <FilesMatch>. <IfModule> wrappers are ignored:
                  # Apache takes one branch, both state the same intent.
                  scope=dir; exts=""; names=""; dots=0
                  if [ "$class" = deny ]; then
                    scopes="$(printf '%s\n' "$body" | awk '
                      { l = $0; sub(/^[ \t]+/, "", l); ll = tolower(l) }
                      ll ~ /^<files(match)?[ \t>]/ {
                        p = l; sub(/^<[^ \t>]*[ \t]*/, "", p); sub(/>[ \t]*$/, "", p)
                        pat = (ll ~ /^<filesmatch/ ? "M " : "F ") p; next }
                      ll ~ /^<\/files/ { pat = ""; next }
                      ll ~ /deny[ \t]+from[ \t]+all|require[ \t]+all[ \t]+denied/ { print (pat == "" ? "ALL" : pat) }
                    ' | sort -u)"
                    if [ -n "$scopes" ] && ! printf '%s\n' "$scopes" | grep -qx ALL; then
                      scope=narrow
                      while IFS= read -r line; do
                        [ -n "$line" ] || continue
                        kind="${line%% *}"; s="${line#* }"
                        # <Files ~ "re"> is a regex, like <FilesMatch>.
                        case "$s" in "~"*) kind=M ;; esac
                        s="$(printf '%s' "$s" | sed -e 's/^~[[:space:]]*//' -e 's/^"//' -e 's/"$//')"
                        if [ "$kind" = F ] && printf '%s' "$s" | grep -qE '^\*\.[A-Za-z0-9]+$'; then
                          exts="$exts ${s#\*.}"
                        elif [ "$kind" = M ] && printf '%s' "$s" | grep -qE '^(\^?\.\*)?\\\.\(?[A-Za-z0-9]+(\|[A-Za-z0-9]+)*\)?\$$'; then
                          exts="$exts $(printf '%s' "$s" | sed -e 's/^\^\{0,1\}\.\*//' -e 's/^\\\.//' -e 's/[()$]//g' -e 's/|/ /g')"
                        elif [ "$kind" = F ] && printf '%s' "$s" | grep -qE '^[A-Za-z0-9_-][A-Za-z0-9._-]*$'; then
                          names="$names $s"
                        elif { [ "$kind" = F ] && [ "${s#.}" != "$s" ]; } || { [ "$kind" = M ] && [ "${s#^\\.}" != "$s" ]; }; then
                          dots=1
                        else
                          scope=dir; break
                        fi
                      done <<SCOPES_EOF
              $scopes
              SCOPES_EOF
                    fi
                  fi
                  if [ "$scope" = narrow ]; then
                    # Judge each extension and name; a directory entry covers them all.
                    covered=yes; by_allowlist=0; open_exts=""; open_names=""
                    # PHP that extraAllowedPaths lets run here: files that exist now,
                    # and whether a new one would be let through as well.
                    php_open="$(awk -v p="$rel/" 'index($0, p) == 1 { printf " %s", $0 }' /tmp/php-open)"
                    php_new=0
                    if matches_any /tmp/php-extra-allowed "$rel/x.php" \
                        || matches_any /tmp/php-extra-allowed "$rel/x/x.php"; then php_new=1; fi
                    if [ "$dir_cov" != yes ]; then
                      for e in $(printf '%s\n' $exts | tr 'A-Z' 'a-z' | sort -u); do
                        if [ "$e" = php ] && [ "$PHP_ALLOWLIST_MODE" = enforce ] \
                            && [ "$PHP_EXTRA_UNCHECKED" = 0 ] && [ -z "$php_open" ] && [ "$php_new" = 0 ]; then
                          by_allowlist=1
                        elif ! denies_all "$dir" "x.$e" -iname "*.$e"; then
                          covered=no; open_exts="$open_exts $e"
                        fi
                      done
                      # <Files name> also governs that name in every subdirectory.
                      for n in $names; do
                        denies_all "$dir" "$n" -name "$n" || { covered=no; open_names="$open_names $n"; }
                      done
                    fi
                    what="$(printf '%s' "$exts $names" | wc -w | tr -d ' ')"
                    if [ "$what" = 1 ] && [ "$(printf '%s' "$exts" | tr 'A-Z' 'a-z' | tr -d ' ')" = php ]; then what="PHP only"
                    else what="${exts:+extensions:$exts}${exts:+${names:+; }}${names:+files:$names}"; fi
                    [ -n "$what" ] || what="dotfiles only"
                  fi
                  first="$(printf '%s' "$body" | head -n1 | cut -c1-70)"
                  case "$class" in
                    deny)
                      if [ "$scope" = narrow ] && [ "$covered" = yes ]; then
                        if [ "$by_allowlist" = 1 ]; then
                          echo "  covered:        $rel/.htaccess ($first) - denies $what; the PHP allowlist answers 403"
                        elif [ "$dots" = 1 ] && [ -z "$exts$names" ]; then
                          echo "  covered:        $rel/.htaccess ($first) - denies dotfiles only; NGINX denies those everywhere"
                        else
                          echo "  covered:        $rel/.htaccess ($first) - denies $what"
                        fi
                      elif [ "$covered" = yes ]; then
                        echo "  covered:        $rel/.htaccess ($first)"
                      elif [ "$plugin_managed" = 1 ]; then
                        echo "  plugin-managed: $rel/.htaccess - a rule for this directory exists in the site's nginx.conf"
                      elif [ "$scope" = narrow ]; then
                        echo "  UNCOVERED:      $rel/.htaccess ($first) - denies $what"
                        if [ -n "$open_exts" ]; then
                          case " $open_exts " in *" php "*)
                            if [ "$PHP_ALLOWLIST_MODE" != enforce ]; then
                              echo "    phpExecutionAllowlist.mode is '$PHP_ALLOWLIST_MODE', so NGINX runs this PHP."
                            elif [ -n "$php_open" ]; then
                              echo "    phpExecutionAllowlist.extraAllowedPaths lets PHP run here:$php_open"
                            elif [ "$php_new" = 1 ]; then
                              echo "    phpExecutionAllowlist.extraAllowedPaths lets new PHP files here run."
                            else
                              echo "    A phpExecutionAllowlist.extraAllowedPaths entry cannot be checked here (it does"
                              echo "    not compile in busybox, or may read differently in NGINX), so the PHP allowlist"
                              echo "    is not credited for this PHP."
                            fi ;;
                          esac
                          echo "    NGINX serves these as they are. To close them, without closing the directory:"
                          set -- $open_exts
                          alt="$(printf '%s|' "$@")"; alt="${alt%|}"
                          [ "$#" -gt 1 ] && alt="($alt)"
                          echo "      - path: '~* ^$(re_quote "$rel")/.*\.$alt\$'"
                          echo "        action: deny"
                          echo "        reason: .htaccess found ($first)"
                        fi
                        if [ -n "$open_names" ]; then
                          echo "    NGINX does not read this file; these files are open, here and in every"
                          echo "    subdirectory. To close them:"
                          for n in $open_names; do
                            echo "      - path: '~* ^$(re_quote "$rel")/(.*/)?$(re_quote "$n")\$'"
                            echo "        action: deny"
                            echo "        reason: .htaccess found ($first)"
                          done
                        fi
                        touch /tmp/htaccess-blocking
                      else
                        echo "  UNCOVERED:      $rel/.htaccess ($first)"
                        echo "    NGINX does not read this file; the directory is open. To close it:"
                        echo "      - path: $rel"
                        echo "        action: deny"
                        echo "        reason: .htaccess found ($first)"
                        touch /tmp/htaccess-blocking
                      fi ;;
                    partial)
                      if [ "$covered" = yes ]; then
                        echo "  WARNING:        $rel is in nginx.deniedPaths, but its .htaccess has allow exceptions"
                        echo "                  ($first). A directory deny breaks whatever the exception served."
                      else
                        echo "  partial:        $rel/.htaccess ($first) - deny with exceptions; not a candidate for deniedPaths"
                      fi ;;
                    allow)
                      echo "  SUSPICIOUS:     $rel/.htaccess ($first)"
                      echo "                  This file ALLOWS access - PHP or dotfiles - rather than denying it."
                      echo "                  In an upload directory that is the usual companion of a webshell."
                      echo "                  NGINX ignores it, but find out who wrote it and when."
                      if [ "$covered" = yes ]; then
                        echo "                  (it is also listed in nginx.deniedPaths - that entry denies the directory,"
                        echo "                   which is fine, but does not make this file less worth a look)"
                      fi ;;
                    empty)
                      echo "  info:           $rel/.htaccess is empty or only comments - no access control at all" ;;
                    *)
                      if [ "$plugin_managed" = 1 ]; then
                        echo "  plugin-managed: $rel/.htaccess ($first) - translated in the site's nginx.conf"
                      else
                        echo "  info:           $rel/.htaccess ($first) - rewrite/header/mime rules, not an access control"
                      fi ;;
                  esac
                done
              fi
              if [ ! -f /tmp/htaccess-found ]; then
                echo "  none found."
              elif [ -f /tmp/htaccess-blocking ] && [ "$HTACCESS_POLICY" = "fail" ]; then
                echo "ERROR: nginx.htaccessPolicy is 'fail' and at least one deny .htaccess is covered"
                echo "       neither by nginx.deniedPaths nor by the PHP allowlist. Refusing to start."
                exit 1
              fi
              echo "Checks completed."
          volumeMounts:
            - name: wordpress-data
              mountPath: /wordpress
              subPath: wordpress
            {{- if .Values.idx.enabled }}
            - name: wordpress-data
              mountPath: /idx
              subPath: idx
            {{- end }}
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
        {{- if .Values.initContainers }}
        {{- include "common.tplvalues.render" (dict "value" .Values.initContainers "context" $) | nindent 8 }}
        {{- end }}
      containers:
        - name: wordpress
          image: {{ include "wordpress.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          {{- else if .Values.command }}
          command: {{- include "common.tplvalues.render" ( dict "value" .Values.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- else if .Values.args }}
          args: {{- include "common.tplvalues.render" ( dict "value" .Values.args "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: ALLOW_EMPTY_PASSWORD
              value: {{ ternary "yes" "no" .Values.allowEmptyPassword | quote }}
            - name: WORDPRESS_SKIP_BOOTSTRAP
              value: {{ ternary "yes" "no" .Values.wordpressSkipInstall | quote }}
            {{- if or .Values.wordpressConfiguration .Values.existingWordPressConfigurationSecret }}
            # Override the default data to persist omiting wp-config.php from the list since
            # it is mounted as a read-only file from a Secret
            - name: WORDPRESS_DATA_TO_PERSIST
              value: "wp-content"
            {{- else }}
            - name: WORDPRESS_DB_HOST
              value: {{ include "wordpress.databaseFullHost" . | quote }}
            - name: WORDPRESS_DB_NAME
              value: {{ include "wordpress.databaseName" . | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ include "wordpress.databaseUser" . | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.databaseSecretName" . }}
                  key: mariadb-password
            - name: WORDPRESS_DB_CHARSET
              value: {{ include "wordpress.databaseCharset" . | quote }}
            - name: WORDPRESS_DB_COLLATE
              value: {{ include "wordpress.databaseCollation" . | quote }}
            - name: WORDPRESS_USERNAME
              value: {{ .Values.wordpressUsername | quote }}
            - name: WORDPRESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.secretName" . }}
                  key: wordpress-password
            - name: WORDPRESS_EMAIL
              value: {{ .Values.wordpressEmail | quote }}
            - name: WORDPRESS_FIRST_NAME
              value: {{ .Values.wordpressFirstName | quote }}
            - name: WORDPRESS_LAST_NAME
              value: {{ .Values.wordpressLastName | quote }}
            - name: WORDPRESS_BLOG_NAME
              value: {{ .Values.wordpressBlogName | quote }}
            - name: WORDPRESS_TABLE_PREFIX
              value: {{ .Values.wordpressTablePrefix | quote }}
            - name: WORDPRESS_SCHEME
              value: {{ .Values.wordpressScheme | quote }}
            {{- if .Values.ingress.hostname }}
            # Canonical hostname for CLI contexts: wp-cli has no HTTP_HOST,
            # and the generated wp-config.php falls back to this for
            # WP_HOME/WP_SITEURL (see the branch there for why).
            - name: WORDPRESS_HOSTNAME
              value: {{ tpl .Values.ingress.hostname $ | quote }}
            {{- end }}
            - name: WORDPRESS_EXTRA_WP_CONFIG_CONTENT
              value: {{ .Values.wordpressExtraConfigContent | quote }}
            - name: WORDPRESS_PLUGINS
              value: {{ join "," .Values.wordpressPlugins | quote }}
            - name: WORDPRESS_OVERRIDE_DATABASE_SETTINGS
              value: {{ ternary "yes" "no" .Values.overrideDatabaseSettings | quote }}
            {{- if .Values.ingress.enabled }}
            - name: WORDPRESS_ENABLE_REVERSE_PROXY
              value: "yes"
            {{- end }}
            {{- end }}
            {{- if .Values.multisite.enable }}
            - name: WORDPRESS_ENABLE_MULTISITE
              value: "yes"
            - name: WORDPRESS_MULTISITE_HOST
              value: {{ .Values.multisite.host | quote }}
            - name: WORDPRESS_MULTISITE_EXTERNAL_HTTP_PORT_NUMBER
              value: {{ .Values.service.ports.http | quote }}
            - name: WORDPRESS_MULTISITE_EXTERNAL_HTTPS_PORT_NUMBER
              value: {{ .Values.service.ports.https | quote }}
            - name: WORDPRESS_MULTISITE_NETWORK_TYPE
              value: {{ .Values.multisite.networkType | quote }}
            - name: WORDPRESS_MULTISITE_ENABLE_NIP_IO_REDIRECTION
              value: {{ ternary "yes" "no" .Values.multisite.enableNipIoRedirect | quote }}
            {{- end }}
            {{- if .Values.smtpHost }}
            - name: SMTP_HOST
              value: {{ .Values.smtpHost | quote }}
            {{- end }}
            {{- if .Values.smtpPort }}
            - name: SMTP_PORT
              value: {{ .Values.smtpPort | quote }}
            {{- end }}
            {{- if .Values.smtpUser }}
            - name: SMTP_USER
              value: {{ .Values.smtpUser | quote }}
            {{- end }}
            {{- if or .Values.smtpPassword .Values.smtpExistingSecret }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.smtpSecretName" . }}
                  key: smtp-password
            {{- end }}
            {{- if .Values.smtpProtocol }}
            {{- if not (has .Values.smtpProtocol (list "tls" "ssl")) }}
            {{- fail (printf "smtpProtocol: %q - must be \"tls\" (STARTTLS, usually port 587), \"ssl\" (implicit TLS, port 465) or empty (unencrypted)" .Values.smtpProtocol) }}
            {{- end }}
            - name: SMTP_TLS
              value: "on"
            {{- if eq .Values.smtpProtocol "ssl" }}
            # msmtp defaults to upgrading via STARTTLS; implicit TLS (smtps)
            # expects the handshake from the first byte instead.
            - name: SMTP_STARTTLS
              value: "off"
            {{- end }}
            {{- end }}
            {{- if .Values.smtpFromEmail }}
            # Envelope sender, and the From header is rewritten to match on
            # the way into msmtp (transport-side, no code in WordPress).
            - name: SMTP_FROM
              value: {{ .Values.smtpFromEmail | quote }}
            {{- if .Values.smtpFromName }}
            - name: SMTP_FROM_NAME
              value: {{ .Values.smtpFromName | quote }}
            {{- end }}
            {{- else if .Values.smtpFromName }}
            {{- fail "smtpFromName requires smtpFromEmail: the display name is part of the rewritten From header and cannot stand alone" }}
            {{- end }}
            {{- if (include "wordpress.cacheHasPassword" .) }}
            # Read by the post-init cache configuration script. Kept in the
            # environment rather than templated into the post-init ConfigMap,
            # which would put the password in plain text into a resource that
            # is not a Secret.
            - name: WORDPRESS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.cacheSecretName" . }}
                  key: {{ include "wordpress.cacheSecretPasswordKey" . }}
            {{- end }}
            - name: NGINX_HTTP_PORT_NUMBER
              value: {{ .Values.containerPorts.http | quote }}
            - name: NGINX_HTTPS_PORT_NUMBER
              value: {{ .Values.containerPorts.https | quote }}
            {{- if .Values.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          envFrom:
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsSecret "context" $) }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
            - name: https
              containerPort: {{ .Values.containerPorts.https }}
            {{- if .Values.extraContainerPorts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraContainerPorts "context" $) | nindent 12 }}
            {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          {{- if not .Values.diagnosticMode.enabled }}
          {{- if .Values.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.livenessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.readinessProbe.enabled }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.readinessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.startupProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- else if ne .Values.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html/wp-content
              subPath: wordpress/wp-content
            - name: wordpress-data
              mountPath: /var/www/html/nginx.conf
              subPath: wordpress/nginx.conf
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
            {{- if or .Values.wordpressConfiguration .Values.existingWordPressConfigurationSecret }}
            - name: wordpress-config
              mountPath: /var/www/html/wp-config.php
              subPath: wp-config.php
            {{- else }}
            - name: wordpress-data
              mountPath: /var/www/html/wp-config.php
              subPath: wordpress/wp-config.php
            - name: wordpress-data
              mountPath: /var/www/html/salts.php
              subPath: wordpress/salts.php
            {{- end }}
            {{- /*
            Post-init scripts are mounted as SINGLE FILES into the image's
            hook directory: the hook runner executes plain executable files
            in /etc/hooks/application via run-parts, which neither descends
            into subdirectories nor runs non-executable files. The previous
            directory mount (at /etc/hook/, which the runner never reads)
            silently executed nothing. The zz- prefix keeps every chart
            script after the image's own init-wordpress.
            */}}
            {{- if .Values.wordpressPreinstallPlugins }}
            - name: custom-postinit
              mountPath: /etc/hooks/application/zz-00-preinstall-plugins.sh
              subPath: 00-preinstall-plugins.sh
              readOnly: true
            {{- end }}
            {{- if .Values.idx.enabled }}
            - name: custom-postinit
              mountPath: /etc/hooks/application/zz-05-idx-plugin.sh
              subPath: 05-idx-plugin.sh
              readOnly: true
            {{- end }}
            {{- if .Values.wordpressConfigureCache }}
            - name: custom-postinit
              mountPath: /etc/hooks/application/zz-10-configure-w3-total-cache.sh
              subPath: 10-configure-w3-total-cache.sh
              readOnly: true
            {{- end }}
            {{- range $name, $_ := .Values.customPostInitScripts }}
            - name: custom-postinit
              mountPath: /etc/hooks/application/zz-{{ $name }}
              subPath: {{ $name }}
              readOnly: true
            {{- end }}
            {{- if or .Values.nginxCustomServerBlockAddition .Values.existingCustomServerBlockAdditionConfigMap }}
            - name: nginx-serverblock-addition
              mountPath: /etc/nginx/custom.d/01_userconfig.conf
              subPath: 01_userconfig.conf
              readOnly: true
            {{- end }}
            {{- if ne .Values.phpExecutionAllowlist.mode "enforce" }}
            - name: nginx-php-allowlist
              mountPath: /etc/nginx/custom.d/00-php-allowlist.conf
              subPath: 00-php-allowlist.conf
              readOnly: true
            {{- end }}
            {{- if .Values.phpExecutionAllowlist.extraAllowedPaths }}
            - name: nginx-php-allowlist
              mountPath: /etc/nginx/php-allowlist.d/50-extra-allow.conf
              subPath: 50-extra-allow.conf
              readOnly: true
            {{- end }}
            {{- if ne .Values.restApiHardening.mode "off" }}
            - name: nginx-rest-hardening
              mountPath: /etc/nginx/custom.d/00-rest-hardening.conf
              subPath: 00-rest-hardening.conf
              readOnly: true
            {{- end }}
            {{- if .Values.restApiHardening.extraDeniedPaths }}
            - name: nginx-rest-hardening
              mountPath: /etc/nginx/rest-hardening.d/50-extra-deny.conf
              subPath: 50-extra-deny.conf
              readOnly: true
            {{- end }}
            {{- if .Values.nginx.deniedPaths }}
            - name: nginx-denied-paths
              mountPath: /etc/nginx/denied-paths.d/10-chart.conf
              subPath: 10-chart.conf
              readOnly: true
            {{- end }}
            {{- if (include "wordpress.redirect.hasGoneHosts" .) }}
            - name: nginx-gone-hosts
              mountPath: /etc/nginx/gone-hosts.d/10-chart.conf
              subPath: 10-chart.conf
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: {{ include "wordpress.metrics.image" . }}
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy | quote }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- else if .Values.diagnosticMode.enabled }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          {{- else }}
          # No command override: the image's entrypoint is the exporter binary.
          args:
            - --nginx.scrape-uri
            - {{ printf "http://127.0.0.1:%d/status" (int (default .Values.containerPorts.http .Values.metrics.port)) | quote }}
            - --web.listen-address
            - {{ printf ":%d" (int .Values.metrics.containerPorts.metrics) | quote }}
            {{- if .Values.metrics.extraArgs }}
            {{- include "common.tplvalues.render" ( dict "value" .Values.metrics.extraArgs "context" $ ) | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.containerPorts.metrics }}
          {{- if not .Values.diagnosticMode.enabled }}
          {{- if .Values.metrics.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.metrics.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.metrics.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.metrics.livenessProbe "enabled") "context" $) | nindent 12 }}
            httpGet:
              path: /metrics
              port: metrics
          {{- end }}
          {{- if .Values.metrics.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.metrics.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.metrics.readinessProbe.enabled }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.metrics.readinessProbe "enabled") "context" $) | nindent 12 }}
            httpGet:
              path: /metrics
              port: metrics
          {{- end }}
          {{- if .Values.metrics.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.metrics.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.metrics.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.metrics.startupProbe "enabled") "context" $) | nindent 12 }}
            tcpSocket:
              port: metrics
          {{- end }}
          {{- end }}
          {{- if .Values.metrics.resources }}
          resources: {{- toYaml .Values.metrics.resources | nindent 12 }}
          {{- else if ne .Values.metrics.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.metrics.resourcesPreset) | nindent 12 }}
          {{- end }}
          {{- if .Values.metrics.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.metrics.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.idx.enabled }}
        - name: idx
          image: {{ include "wordpress.idx.image" . }}
          imagePullPolicy: {{ .Values.idx.image.pullPolicy | quote }}
          env:
            - name: DB_HOST
              value: {{ include "wordpress.databaseHost" . | quote }}
            - name: DB_PORT
              value: {{ include "wordpress.databasePort" . | quote }}
            - name: DB_USER
              value: {{ include "wordpress.databaseUser" . | quote }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.databaseSecretName" . }}
                  key: mariadb-password
            - name: DB_NAME
              value: {{ include "wordpress.databaseName" . | quote }}
            - name: DB_PREFIX
              value: {{ .Values.wordpressTablePrefix | quote }}
            - name: DB_CHARSET
              value: {{ include "wordpress.databaseCharset" . | quote }}
            - name: DB_COLLATE
              value: {{ include "wordpress.databaseCollation" . | quote }}
            - name: PORT
              value: {{ .Values.idx.port | quote }}
            - name: DATA_DIR
              value: "/idx"
            - name: BASE_PATH
              value: {{ .Values.idx.basePath | quote }}
            - name: STARTUP_DELAY
              value: {{ .Values.idx.startupDelay | quote }}
            - name: FORCE_UPDATE
              value: {{ .Values.idx.forceUpdate | quote }}
            - name: CORS_ORIGIN
              value: {{ .Values.idx.corsOrigin | quote }}
            - name: PLUGIN_AUTO_UPDATE
              value: {{ .Values.idx.pluginAutoUpdate | quote }}
            {{- if or .Values.idx.reindexApiKey .Values.idx.existingReindexApiKeySecret }}
            - name: REINDEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.idx.reindexApiKeySecretName" . }}
                  key: idx-reindex-api-key
            {{- end }}
          ports:
            - name: idx
              containerPort: {{ .Values.idx.port }}
          livenessProbe:
            httpGet:
              path: {{ printf "%s/healthz" .Values.idx.basePath }}
              port: idx
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: {{ printf "%s/readyz" .Values.idx.basePath }}
              port: idx
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          {{- if .Values.idx.resources }}
          resources: {{- toYaml .Values.idx.resources | nindent 12 }}
          {{- else if ne .Values.idx.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.idx.resourcesPreset) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: wordpress-data
              mountPath: /idx
              subPath: idx
        {{- end }}
        {{- if .Values.sidecars }}
        {{- include "common.tplvalues.render" (dict "value" .Values.sidecars "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        - name: empty-dir
          emptyDir: {}
        {{- if or .Values.wordpressConfiguration .Values.existingWordPressConfigurationSecret }}
        - name: wordpress-config
          secret:
            secretName: {{ include "wordpress.configSecretName" . }}
            defaultMode: 0644
        {{- end }}
        {{- if or .Values.nginxConfiguration .Values.existingNginxConfigurationConfigMap }}
        - name: nginx-config
          configMap:
            name: {{ include "wordpress.nginx.configmapName" . }}
            defaultMode: 0644
        {{- end }}
        {{- if or .Values.nginxCustomServerBlockAddition .Values.existingCustomServerBlockAdditionConfigMap }}
        - name: nginx-serverblock-addition
          configMap:
            name: {{ include "wordpress.nginx.serverblockConfigmapName" . }}
            defaultMode: 0644
        {{- end }}
        {{- if (include "wordpress.createPostinitConfigmap" .) }}
        - name: custom-postinit
          configMap:
            name: {{ printf "%s-postinit" (include "common.names.fullname" .) }}
            # run-parts skips non-executable files, and a readOnly subPath
            # mount cannot be chmod'd inside the container - without the
            # exec bit here the scripts are mounted and never run. The hook
            # runs as root during init, so no bits for "other": 0750.
            defaultMode: 0750
        {{- end }}
        {{- if (include "wordpress.nginx.createPhpAllowlistConfigmap" .) }}
        - name: nginx-php-allowlist
          configMap:
            name: {{ include "wordpress.nginx.phpAllowlistConfigmapName" . }}
            defaultMode: 0644
        {{- end }}
        {{- if (include "wordpress.nginx.createRestHardeningConfigmap" .) }}
        - name: nginx-rest-hardening
          configMap:
            name: {{ include "wordpress.nginx.restHardeningConfigmapName" . }}
            defaultMode: 0644
        {{- end }}
        {{- if .Values.nginx.deniedPaths }}
        - name: nginx-denied-paths
          configMap:
            name: {{ include "wordpress.nginx.deniedPathsConfigmapName" . }}
            defaultMode: 0644
        {{- end }}
        {{- if (include "wordpress.redirect.hasGoneHosts" .) }}
        - name: nginx-gone-hosts
          configMap:
            name: {{ include "wordpress.nginx.goneHostsConfigmapName" . }}
            defaultMode: 0644
        {{- end }}
        - name: wordpress-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "common.names.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
