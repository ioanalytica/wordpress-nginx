name: Docker image smoke test

# Pull requests run both jobs whatever files they touch: there is no `paths`
# filter on that trigger. A workflow skipped by a path filter leaves its
# checks pending, so a ruleset that requires `smoke-test` and
# `chart-template-test` would block every pull request outside the filter for
# good. The two jobs take one to two and a half minutes, less than the review
# of the pull request, so they are not skipped for changes that cannot affect
# them either: a list of such changes would have to follow every file the
# tests come to read.
#
# Pushes to main keep the filter. No merge waits for their result.
on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'chart/**'
      - 'scripts/**'
      - '.github/workflows/docker-test.yml'
  pull_request:

# Both jobs only read the repository. The build cache (type=gha) uses the
# runner's own cache token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./docker
          platforms: linux/amd64
          load: true
          tags: wordpress-nginx:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: ./docker/tests/smoke-test.sh wordpress-nginx:smoke-test

  chart-template-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # chart/charts/ is gitignored, so the common dependency has to be
      # resolved here. It is a public OCI chart, no registry login needed.
      - name: Resolve chart dependencies
        run: helm dependency update chart/

      - name: Lint chart
        run: helm lint chart/

      - name: Run template test
        run: ./chart/tests/template-test.sh

      - name: Run .htaccess classifier test
        run: ./docker/tests/htaccess-test.sh

      - name: Run file-integrity watcher test
        run: ./chart/tests/fim-test.sh
