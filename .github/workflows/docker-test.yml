name: Docker image smoke test

on:
  push:
    branches:
      - develop
    paths:
      - 'docker/**'
      - '.github/workflows/docker-test.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-test.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./docker
          platforms: linux/amd64
          load: true
          tags: wordpress-nginx:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: ./docker/tests/smoke-test.sh wordpress-nginx:smoke-test

  chart-template-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # chart/charts/ is gitignored, so the common dependency has to be
      # resolved here. It is a public OCI chart, no registry login needed.
      - name: Resolve chart dependencies
        run: helm dependency update chart/

      - name: Lint chart
        run: helm lint chart/

      - name: Run template test
        run: ./chart/tests/template-test.sh
