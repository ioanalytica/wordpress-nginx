name: Track upstream WordPress releases

on:
  schedule:
    - cron: '0 5 * * *'  # Daily at 05:00 UTC (one hour after the CVE scan)
  workflow_dispatch:      # Allow manual trigger

permissions: {}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # open the pull request
    steps:
      # The token stays in .git/config: create-pull-request pushes the
      # branch with it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest WordPress version
        id: wp
        run: |
          latest=$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers[0].current')
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "Could not determine latest WordPress version" >&2
            exit 1
          fi
          # The answer ends up in files, a branch name and the pull request's
          # text: nothing but a version gets that far. Matched as a whole,
          # not with grep, which would accept a value of several lines whose
          # first line is a version.
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Upstream reports '$latest', which is not a WordPress version" >&2
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Read current version
        id: current
        run: |
          current=$(sed -n 's/^ENV WP_VERSION=//p' docker/Dockerfile)
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: cmp
        env:
          latest: ${{ steps.wp.outputs.latest }}
          current: ${{ steps.current.outputs.current }}
        run: |
          if [ "$latest" = "$current" ]; then
            echo "Already up to date ($current)"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only proceed when upstream is strictly newer than what we ship.
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          if [ "$newest" != "$latest" ]; then
            echo "Current ($current) is newer than or equal to upstream ($latest); nothing to do"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "New WordPress release available: $current -> $latest"
          # The first chart version on a WordPress release is x.y.(z * 100), see
          # scripts/chart-version.sh. WordPress reports x.y.0 releases with two
          # components (e.g. "7.2"), which the script reads as patch 0.
          # WP_VERSION and appVersion keep the raw upstream string.
          chart_version=$(scripts/chart-version.sh first "$latest")
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "update=true" >> "$GITHUB_OUTPUT"

      - name: Apply version bump
        if: steps.cmp.outputs.update == 'true'
        env:
          NEW: ${{ steps.wp.outputs.latest }}
          CHART_VERSION: ${{ steps.cmp.outputs.chart_version }}
        run: |
          set -euo pipefail
          # New WordPress version => the build number starts over at 0.
          # WP_VERSION/appVersion track the raw upstream string; the chart version
          # is CHART_VERSION, and with it the tag of both images of this
          # project in the list Artifact Hub reads. appVersion is quoted so a
          # numeric value like "7.1" stays a YAML string, not a float.
          sed -i "s/^ENV WP_VERSION=.*/ENV WP_VERSION=${NEW}/" docker/Dockerfile
          sed -i "s/^version: .*/version: ${CHART_VERSION}/" chart/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${NEW}\"/" chart/Chart.yaml
          sed -i "s|^      image: ghcr.io/ioanalytica/wordpress-nginx:.*|      image: ghcr.io/ioanalytica/wordpress-nginx:${CHART_VERSION}|" chart/Chart.yaml
          sed -i "s|^      image: ghcr.io/ioanalytica/wordpress-idx:.*|      image: ghcr.io/ioanalytica/wordpress-idx:${CHART_VERSION}|" chart/Chart.yaml
          # The changelog entry of the new version. This pull request is a
          # release pull request: what earlier pull requests left under
          # "## Unreleased" ships with it, so that section becomes the
          # version's, below the line for the WordPress update.
          scripts/changelog-release.sh "${CHART_VERSION}" \
            "* Update to WordPress ${NEW}. Review the [WordPress release notes](https://wordpress.org/news/) before upgrading."
          echo "----- Dockerfile -----"; grep '^ENV WP_VERSION=' docker/Dockerfile
          echo "----- Chart.yaml -----"; grep -E '^(version|appVersion):|ioanalytica/wordpress-(nginx|idx):' chart/Chart.yaml
          echo "----- CHANGELOG.md -----"; sed -n '1,12p' chart/CHANGELOG.md

      - name: Create Pull Request
        if: steps.cmp.outputs.update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: wp-bump/${{ steps.wp.outputs.latest }}
          base: main
          # CONTRIBUTING.md asks for a Signed-off-by line on every commit.
          signoff: true
          # Bot-authored PRs only reach the watching inbox, where they get buried;
          # a review request lands in the participating inbox and triggers email.
          reviewers: ioanalytica
          commit-message: "Version ${{ steps.cmp.outputs.chart_version }}"
          title: "Bump WordPress to ${{ steps.wp.outputs.latest }} (${{ steps.cmp.outputs.chart_version }})"
          body: |
            Automated version bump: upstream WordPress **${{ steps.wp.outputs.latest }}** is available (was `${{ steps.current.outputs.current }}`).

            Bumped:
            - `docker/Dockerfile` — `WP_VERSION=${{ steps.wp.outputs.latest }}`
            - `chart/Chart.yaml` — `version` and both images of this project in `artifacthub.io/images` → `${{ steps.cmp.outputs.chart_version }}`, `appVersion` → `${{ steps.wp.outputs.latest }}`
            - `chart/CHANGELOG.md` — the entry for `${{ steps.cmp.outputs.chart_version }}`. Changes merged since the last release were listed under `## Unreleased`; they are part of this entry now and ship with this version.

            **After the merge, tag the merge commit** to start the release, which builds, signs and publishes both images and the chart. A release candidate first, `${{ steps.cmp.outputs.chart_version }}-rc.1` on the same commit, runs the whole release without moving `latest`:

            ```
            git tag ${{ steps.cmp.outputs.chart_version }}
            git push origin ${{ steps.cmp.outputs.chart_version }}
            ```

            WordPress release notes: https://wordpress.org/news/
