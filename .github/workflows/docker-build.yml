name: Build and push Docker image and Helm chart

on:
  push:
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build image for smoke test
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./docker
          platforms: linux/amd64
          load: true
          tags: wordpress-nginx:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: ./docker/tests/smoke-test.sh wordpress-nginx:smoke-test

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # chart/charts/ is gitignored, so the common dependency has to be
      # resolved before the chart can be linted, rendered or packaged.
      - name: Resolve chart dependencies
        run: helm dependency update chart/

      - name: Lint chart
        run: helm lint chart/

      - name: Run chart template test
        run: ./chart/tests/template-test.sh

      - name: Run .htaccess classifier test
        run: ./docker/tests/htaccess-test.sh

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package Helm chart
        run: helm package chart/

      - name: Push Helm chart to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
          helm push wordpress-nginx-${{ steps.meta.outputs.version }}.tgz oci://${{ env.REGISTRY }}/ioanalytica/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Version ${{ steps.meta.outputs.version }}
          generate_release_notes: true
