# PHP execution allowlist enforcement (see the $wp_php_denied map in
# nginx.conf and the allow patterns in /etc/nginx/php-allowlist.d/).
#
# This file must sort before 01-common.conf so the check runs in the rewrite
# phase before any rewrite from later files can jump to location matching.
# The Helm chart mounts a replacement over this file for report/off modes.
if ($wp_php_denied) { return 403; }
# /proc/1/fd/2 (not /dev/stderr): nginx runs under s6, so its own stderr is
# not the container's stderr.
access_log /proc/1/fd/2 php_allowlist if=$wp_php_denied;
