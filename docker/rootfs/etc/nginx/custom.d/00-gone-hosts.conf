# Gone-host enforcement (see the $wp_gone_action map in nginx.conf and the
# hostname entries in /etc/nginx/gone-hosts.d/).
#
# Sorts after 00-denied-paths.conf, so a honeypot path keeps answering 418
# on a retired host, and before 00-php-allowlist.conf, so a crawler's 410
# wins over the allowlist's 403 for .php paths - exactly the URLs a crawler
# replaying a dead site keeps requesting.
#
# "return" takes a literal status, not a variable, hence one test per action.
if ($wp_gone_action = gone) { return 410; }
if ($wp_gone_action = redirect) { return 301 $wp_gone_target; }
