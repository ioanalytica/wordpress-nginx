# REST API hardening enforcement (see the $wp_rest_denied map in nginx.conf and
# the deny patterns in /etc/nginx/rest-hardening.d/).
#
# Runs in the rewrite phase, before any location is chosen, so it cannot be
# outrun by location matching order. The Helm chart mounts a replacement over
# this file for report/off modes.
if ($wp_rest_denied) { return 403; }
# /proc/1/fd/2 (not /dev/stderr): nginx runs under s6, so its own stderr is
# not the container's stderr.
access_log /proc/1/fd/2 rest_hardening if=$wp_rest_denied;
