# REST API and author enumeration hardening: inert by default.
#
# The $wp_rest_blocked map in nginx.conf and the deny patterns in
# /etc/nginx/rest-hardening.d/ are always defined, but nothing acts on them
# unless the Helm chart mounts a replacement over this file
# (restApiHardening.mode: enforce or report).
#
# It is off by default on purpose. Blocking these routes stops automated
# scanners, but the same login names remain reachable through the pretty
# author archive and through oEmbed, and the session-cookie exemption the
# rules need in order not to break the block editor is satisfied by any
# forged cookie. A control that changes what a scanner reports without
# changing what a determined caller can learn is not worth a breaking
# default. See the chart README for the root-cause fix (user_nicename).
