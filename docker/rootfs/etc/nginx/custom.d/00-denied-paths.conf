# Denied path enforcement (see the $wp_denied_status map in nginx.conf and the
# patterns in /etc/nginx/denied-paths.d/).
#
# Sorts ahead of 00-php-allowlist.conf so a honeypot status survives: the
# allowlist answers 403 for any .php outside its entry points, which would
# otherwise swallow the honeypot response for exactly the paths worth trapping.
#
# "return" takes a literal status, not a variable, hence one test per status
# rather than a single "return $wp_denied_status".
if ($wp_denied_status = 403) { return 403; }
if ($wp_denied_status = 418) { return 418; }
