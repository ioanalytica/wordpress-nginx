# Requests denied for anonymous callers. These are NGINX map entries for the
# $wp_rest_denied map (1 = denied), matched against the synthetic key
# "$uri?rest_route=$arg_rest_route&author=$arg_author" built in nginx.conf.
#
# All three patterns lead to the same information: the site's login names,
# which are half of a credential pair and the opening move of every automated
# login attack. WordPress exposes all three to unauthenticated callers.
#
# The REST users route, in both of its spellings.
"~*^/wp-json/wp/v2/users(/|\?)" 1;
"~*\?rest_route=/wp/v2/users(/|&)" 1;
# The author archive addressed by numeric id, which redirects to
# /author/<login>/ and thereby maps an id to a name. The pretty form
# /author/<slug>/ is a legitimate public feature and stays reachable.
"~*&author=[0-9]" 1;
