# WordPress REST routes denied for direct requests. These are NGINX map entries
# for the $wp_rest_denied map (1 = denied).
#
# The users route lets anyone list the site's account names, which is half of a
# credential pair. WordPress exposes it to unauthenticated callers by design.
# Both spellings of the route are covered: the pretty-permalink path and the
# rest_route query argument.
"~*^/wp-json/wp/v2/users(/|\?|$)" 1;
"~*\?/wp/v2/users(/|$)" 1;
