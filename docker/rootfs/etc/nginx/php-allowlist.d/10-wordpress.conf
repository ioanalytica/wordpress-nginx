# WordPress core entry points allowed to execute PHP via direct URL request.
# These are nginx map entries for the $wp_php_denied map (0 = allowed).
# Plugins and themes do not need entries here: their code is include()d by
# WordPress and reached through index.php, wp-admin/, admin-ajax.php, the
# REST API (rewritten to index.php) or wp-cron.php.
"~*^/(index|wp-login|wp-cron|wp-comments-post|wp-signup|wp-activate|healthz)\.php(/|$)" 0;
"~*^/wp-admin/.*\.php$" 0;
