worker_processes auto;
worker_rlimit_nofile 65535;

events {
    multi_accept on;
    worker_connections 1024;
}

http {
    charset utf-8;
    sendfile on;
    autoindex off;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    log_not_found off;
    types_hash_max_size 2048;
    types_hash_bucket_size 64;
    client_max_body_size 16M;
    uninitialized_variable_warn off;

    # PHP upstream
    upstream @php {
        server unix:/run/php-fpm.sock;
        server 127.0.0.1:9000 backup;
    }

    # MIME
    include mime.types;
    default_type application/octet-stream;

    # Log Format
    log_format custom '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $http_cf_ray $http_cf_connecting_ip $http_x_forwarded_for $http_x_forwarded_proto $http_true_client_ip $http_cf_ipcountry $http_cf_visitor $http_cdn_loop';
    log_format php_allowlist '[php-allowlist] $status $remote_addr "$request" ref="$http_referer" ua="$http_user_agent"';
    log_format rest_hardening '[rest-hardening] $status $remote_addr "$request" ref="$http_referer" ua="$http_user_agent"';

    # Operator-declared denied paths. Entries map a URI to the status to answer
    # with; the patterns come from /etc/nginx/denied-paths.d/, which the Helm
    # chart fills from nginx.deniedPaths.
    #
    # Enforced in the rewrite phase (custom.d/00-denied-paths.conf), which sorts
    # ahead of the PHP allowlist. That ordering is the point: a honeypot status
    # on a .php path is only reachable before the allowlist answers 403. It also
    # sidesteps location matching entirely - a plain prefix location loses to any
    # matching regex location, so a "location /wp-content/uploads/x { deny all; }"
    # is silently bypassed for every extension the static-file location matches.
    map $uri $wp_denied_status {
        include /etc/nginx/denied-paths.d/*.conf;
        default 0;
    }

    # PHP execution allowlist: only known entry points may execute PHP via a
    # direct URL request. Entries are matched in order; the allow patterns come
    # from /etc/nginx/php-allowlist.d/ and must precede the catch-all deny.
    # Enforcement happens at the server level (custom.d/00-php-allowlist.conf),
    # in the rewrite phase, so it is independent of location matching order.
    map $uri $wp_php_denied {
        include /etc/nginx/php-allowlist.d/*.conf;
        "~*\.php(/|$)" 1;
        default 0;
    }

    # REST API and author enumeration hardening: requests answered with 403 for
    # anonymous callers. Deny patterns come from /etc/nginx/rest-hardening.d/.
    #
    # The map key is a synthetic canonical string joining the normalized path
    # with the two query arguments that carry an enumeration vector, because the
    # same information is reachable through several spellings: a REST route
    # answers both as /wp-json/<route> and as /?rest_route=/<route>, and the
    # author archive maps a numeric id to a login name via /?author=N. Matching
    # the path alone would leave the other forms open.
    map "$uri?rest_route=$arg_rest_route&author=$arg_author" $wp_rest_denied {
        include /etc/nginx/rest-hardening.d/*.conf;
        default 0;
    }

    # Presence of a WordPress session cookie. This is not authentication - the
    # cookie is not validated, and forging the name is trivial. It is the line
    # between "an automated scanner" and "a browser that has logged in at some
    # point", which is what the deny rules above are aimed at: they stop bulk
    # enumeration without breaking the block editor's author selector or the
    # author filter in the wp-admin posts list, both of which request the very
    # URLs the rules deny. Authorization that must hold against a targeted
    # attacker belongs in WordPress, not in the reverse proxy.
    map $http_cookie $wp_session_cookie {
        "~*wordpress_logged_in_" 1;
        default 0;
    }

    # Final decision: deny only when a pattern matched AND no session cookie is
    # present. Enforcement happens at the server level
    # (custom.d/00-rest-hardening.conf), in the rewrite phase, so it is
    # independent of location matching order.
    map "$wp_rest_denied$wp_session_cookie" $wp_rest_blocked {
        "10" 1;
        default 0;
    }

    # Marker used by report mode. Declared here with a default so the
    # report-mode configuration can "set" it: values assigned with "set"
    # survive an internal redirect, whereas $wp_rest_denied is re-evaluated
    # and would read 0 by the time the log phase runs, because try_files has
    # rewritten $uri to /index.php. Enforce mode is unaffected - it returns
    # 403 in the rewrite phase, before any redirect happens.
    map $host $wp_rest_reported {
        default 0;
    }

    # Logging
    access_log off;
    error_log /dev/stderr error;

    # SSL
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Diffie-Hellman parameter for DHE ciphersuites
    ssl_dhparam /etc/ssl/site/dhparam.pem;

    # Mozilla Intermediate configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # OCSP Stapling
    ssl_stapling off;
    ssl_stapling_verify on;
    resolver_timeout 2s;
    resolver
        1.1.1.1 1.0.0.1 [2606:4700:4700::1111] [2606:4700:4700::1001]
        8.8.8.8 8.8.4.4 [2001:4860:4860::8888] [2001:4860:4860::8844]
        208.67.222.222 208.67.220.220 [2620:119:35::35] [2620:119:53::53]
        valid=60s;

    # Get client IP behind proxy servers
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Load enabled settings
    include /etc/nginx/modules-enabled/*.conf;
    include /etc/nginx/sites-enabled/*.conf;
}
