# Retired hostnames are NGINX map entries for the $wp_gone_target map:
# a hostname, then the URL a browser is redirected to.
#
#   "forum.example.com" "https://example.com/";
#
# The Helm chart renders redirect.goneHosts into 10-chart.conf in this
# directory. This file exists so the include has something to read on a
# bare image.
