# Denied path patterns are NGINX map entries for the $wp_denied_status map:
# a regex, then the HTTP status to answer with.
#
#   "~*^/wp-content/uploads/example(/|$)" 403;
#
# The Helm chart renders nginx.deniedPaths into 10-chart.conf in this directory.
# This file exists so the include has something to read on a bare image.
